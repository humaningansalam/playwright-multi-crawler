[project]
name = "playwright-multi-crawler"
version = "0.4.4"
description = "Submit and run isolated Playwright automation jobs through a FastAPI service."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "his-monitoring @ git+https://github.com/humaningansalam/his-monitoring.git@1ca4734971cf03862de43276a6d54d45d14932ea",
    "httpx>=0.28.1",
    "playwright>=1.61,<2",
    "pydantic>=2,<3",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "pyvirtualdisplay>=3.0",
    "uvicorn>=0.38.0",
]

[project.scripts]
crawler = "src.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.8",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C90", "E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"src/api/jobs.py" = ["B008"]
"src/worker/job_runner.py" = ["E402"]
